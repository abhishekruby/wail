<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="scanlines" width="512" height="8" patternUnits="userSpaceOnUse">
      <rect width="512" height="2" fill="#7CFF9E" fill-opacity="0.06" />
    </pattern>
    <radialGradient id="crtGlow" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#7CFF9E" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#56a86e" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0b0f0c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ghostFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9ffe4" />
      <stop offset="28%" stop-color="#7CFF9E" />
      <stop offset="100%" stop-color="#7CFF9E" />
    </linearGradient>
    <filter id="phosphorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="ghostClip">
      <path d="M 152 224 C 152 142, 196 96, 256 96 C 316 96, 360 142, 360 224 L 368 376 C 350 404, 330 404, 314 376 C 298 348, 276 348, 256 384 C 236 348, 214 348, 198 376 C 182 404, 162 404, 144 376 Z" />
    </clipPath>
  </defs>

  <!-- Full-bleed background for maskable PWA icon -->
  <rect width="512" height="512" fill="#0b0f0c" />
  <rect width="512" height="512" fill="url(#crtGlow)" />
  <rect width="512" height="512" fill="url(#scanlines)" />

  <!-- Acoustic broadcast wavefronts (strictly inside central 80% circle r <= 188) -->
  <g fill="none" stroke-linecap="round" filter="url(#phosphorGlow)">
    <path d="M 92 164 A 180 180 0 0 0 92 332" stroke="#56a86e" stroke-width="13" />
    <path d="M 420 164 A 180 180 0 0 1 420 332" stroke="#56a86e" stroke-width="13" />
    <path d="M 122 188 A 142 142 0 0 0 122 308" stroke="#7CFF9E" stroke-width="15" />
    <path d="M 390 188 A 142 142 0 0 1 390 308" stroke="#7CFF9E" stroke-width="15" />
  </g>

  <!-- Spectrogram-banded ghost silhouette -->
  <g filter="url(#phosphorGlow)">
    <g clip-path="url(#ghostClip)">
      <rect x="140" y="92" width="232" height="320" fill="url(#ghostFill)" />
      <!-- Horizontal spectrogram raster bands -->
      <g fill="#0b0f0c" fill-opacity="0.82">
        <rect x="140" y="116" width="232" height="5" />
        <rect x="140" y="140" width="232" height="5" />
        <rect x="140" y="164" width="232" height="5" />
        <rect x="140" y="240" width="232" height="5" />
        <rect x="140" y="316" width="232" height="5" />
        <rect x="140" y="340" width="232" height="5" />
        <rect x="140" y="364" width="232" height="5" />
      </g>
    </g>
  </g>

  <!-- High-contrast eyes and wailing modem mouth (crisp at 48 px) -->
  <ellipse cx="216" cy="204" rx="18" ry="23" fill="#0b0f0c" />
  <ellipse cx="296" cy="204" rx="18" ry="23" fill="#0b0f0c" />
  <ellipse cx="256" cy="274" rx="23" ry="31" fill="#0b0f0c" />
  <ellipse cx="256" cy="274" rx="10" ry="14" fill="none" stroke="#56a86e" stroke-width="4" />
</svg>
