<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="ogScan" width="1200" height="6" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1.5" fill="#7CFF9E" fill-opacity="0.05" />
    </pattern>
    <radialGradient id="ogGlow" cx="18%" cy="46%" r="36%">
      <stop offset="0%" stop-color="#7CFF9E" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#56a86e" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0b0f0c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ogGhostFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9ffe4" />
      <stop offset="30%" stop-color="#7CFF9E" />
      <stop offset="100%" stop-color="#7CFF9E" />
    </linearGradient>
    <filter id="ogBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="ogGhostClip">
      <path d="M 152 224 C 152 142, 196 96, 256 96 C 316 96, 360 142, 360 224 L 368 376 C 350 404, 330 404, 314 376 C 298 348, 276 348, 256 384 C 236 348, 214 348, 198 376 C 182 404, 162 404, 144 376 Z" />
    </clipPath>
  </defs>

  <!-- Terminal background -->
  <rect width="1200" height="630" fill="#0b0f0c" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />

  <!-- Outer CRT terminal window -->
  <rect x="36" y="32" width="1128" height="566" rx="12" fill="#0b0f0c" stroke="#56a86e" stroke-width="2" />
  <line x1="36" y1="82" x2="1164" y2="82" stroke="#56a86e" stroke-width="1.5" />

  <!-- Terminal status bar -->
  <g font-family="ui-monospace, 'Cascadia Mono', 'Liberation Mono', Menlo, Monaco, Consolas, monospace" font-size="16">
    <circle cx="68" cy="57" r="6" fill="#7CFF9E" />
    <text x="86" y="63" fill="#7CFF9E" font-weight="700">WAIL // ACOUSTIC BROADCAST MODEM</text>
    <text x="1136" y="63" fill="#FFB347" text-anchor="end">OFFLINE · 48 kHz FSK</text>
  </g>

  <!-- Left: Wail spectrogram-ghost icon (scaled from 512x512 into 268x268 box) -->
  <g transform="translate(76, 134) scale(0.525)">
    <g fill="none" stroke-linecap="round" filter="url(#ogBlur)">
      <path d="M 92 164 A 180 180 0 0 0 92 332" stroke="#56a86e" stroke-width="13" />
      <path d="M 420 164 A 180 180 0 0 1 420 332" stroke="#56a86e" stroke-width="13" />
      <path d="M 122 188 A 142 142 0 0 0 122 308" stroke="#7CFF9E" stroke-width="15" />
      <path d="M 390 188 A 142 142 0 0 1 390 308" stroke="#7CFF9E" stroke-width="15" />
    </g>
    <g filter="url(#ogBlur)">
      <g clip-path="url(#ogGhostClip)">
        <rect x="140" y="92" width="232" height="320" fill="url(#ogGhostFill)" />
        <g fill="#0b0f0c" fill-opacity="0.82">
          <rect x="140" y="116" width="232" height="5" />
          <rect x="140" y="140" width="232" height="5" />
          <rect x="140" y="164" width="232" height="5" />
          <rect x="140" y="240" width="232" height="5" />
          <rect x="140" y="316" width="232" height="5" />
          <rect x="140" y="340" width="232" height="5" />
          <rect x="140" y="364" width="232" height="5" />
        </g>
      </g>
    </g>
    <ellipse cx="216" cy="204" rx="18" ry="23" fill="#0b0f0c" />
    <ellipse cx="296" cy="204" rx="18" ry="23" fill="#0b0f0c" />
    <ellipse cx="256" cy="274" rx="23" ry="31" fill="#0b0f0c" />
    <ellipse cx="256" cy="274" rx="10" ry="14" fill="none" stroke="#56a86e" stroke-width="4" />
  </g>

  <!-- Right: Wordmark and required pitch copy (all directly on #0b0f0c) -->
  <g font-family="ui-monospace, 'Cascadia Mono', 'Liberation Mono', Menlo, Monaco, Consolas, monospace">
    <text x="390" y="232" font-size="108" font-weight="700" letter-spacing="8" fill="#7CFF9E">WAIL</text>

    <text x="390" y="302" font-size="30" fill="#d9ffe4">
      <tspan x="390" dy="0">Broadcast a message to every phone</tspan>
      <tspan x="390" dy="44">in the room. <tspan fill="#7CFF9E" font-weight="700">No internet.</tspan></tspan>
    </text>

    <text x="390" y="410" font-size="18" fill="#56a86e">NO SIM DATA  ·  NO PAIRING  ·  CRC-32 VERIFIED</text>
  </g>

  <!-- Bottom FSK waterfall spectrogram strip -->
  <line x1="68" y1="458" x2="1132" y2="458" stroke="#56a86e" stroke-width="1" stroke-dasharray="6 6" />
  <!-- Amber tone-band brackets -->
  <path d="M 78 476 L 68 476 L 68 566 L 78 566" fill="none" stroke="#FFB347" stroke-width="2.5" />
  <path d="M 1122 476 L 1132 476 L 1132 566 L 1122 566" fill="none" stroke="#FFB347" stroke-width="2.5" />

  <!-- Stepped FSK spectrogram blocks (1.9 - 6.3 kHz visual motif) -->
  <g>
    <rect x="92"  y="532" width="38" height="12" rx="2" fill="#56a86e" />
    <rect x="140" y="502" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="140" y="546" width="38" height="10" rx="2" fill="#56a86e" />
    <rect x="188" y="486" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="236" y="518" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="284" y="494" width="38" height="12" rx="2" fill="#56a86e" />
    <rect x="284" y="540" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="332" y="510" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="380" y="484" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="428" y="526" width="38" height="12" rx="2" fill="#56a86e" />
    <rect x="476" y="498" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="476" y="544" width="38" height="10" rx="2" fill="#56a86e" />
    <rect x="524" y="514" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="572" y="488" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="620" y="534" width="38" height="12" rx="2" fill="#56a86e" />
    <rect x="668" y="504" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="716" y="484" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="716" y="528" width="38" height="10" rx="2" fill="#56a86e" />
    <rect x="764" y="516" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="812" y="492" width="38" height="12" rx="2" fill="#56a86e" />
    <rect x="860" y="538" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="908" y="506" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="956" y="486" width="38" height="12" rx="2" fill="#7CFF9E" />
    <rect x="1004" y="522" width="38" height="12" rx="2" fill="#56a86e" />
    <rect x="1052" y="498" width="48" height="12" rx="2" fill="#7CFF9E" />
  </g>

  <!-- Subtle 6% CRT scanlines across whole frame -->
  <rect width="1200" height="630" fill="url(#ogScan)" pointer-events="none" />
</svg>
